{{define "annotation-panel"}}
<div id="annotation-panel-content">
  {{if .Feedback}}<p class="annotation-panel-feedback {{.FeedbackKind}}" role="status" tabindex="-1">{{.Feedback}}</p>{{end}}
  {{if .Cards}}
  <div class="annotation-list" aria-live="polite">
    {{range .Cards}}{{template "annotation-card" .}}{{end}}
  </div>
  {{else}}
  <div class="annotation-list" aria-live="polite">
    <p class="review-message">{{.EmptyMessage}}</p>
  </div>
  {{end}}
</div>
{{end}}

{{define "annotation-panel-response"}}
<span id="annotation-count" class="annotation-count" aria-live="polite" hx-swap-oob="outerHTML">{{.CountLabel}}</span>
{{template "annotation-panel" .}}
{{end}}
